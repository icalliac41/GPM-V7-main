name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Menyiapkan Gradle 9.3.1 resmi yang kompatibel dengan Android Gradle Plugin 9.1.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    # Menyiapkan file .env kosong untuk Secrets plugin
    - name: Create .env file
      run: |
        touch .env

    # Menyiapkan izin eksekusi gradlew dan mendekode keystore debug
    - name: Prepare Keystore and Wrapper
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi
        if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    # Build APK Debug (otomatis menggunakan gradlew jika ada, atau gradle dari setup-gradle jika tidak ada)
    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    # Upload hasil APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
