# Project-wide Gradle settings — PhoneIDE / HP optimized
# RAM-safe untuk build di HP RAM terbatas

# Heap: 4g → 1g (sesuai RAM HP)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:CICompilerCount=2 -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# Matikan daemon & parallel (kurangi peak RAM)
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# Configuration cache — matikan dulu (kadang bentrok di PhoneIDE)
# org.gradle.configuration-cache=true

# Kotlin / KSP — in-process biar tidak spawn daemon tambahan
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
ksp.useKSP2=true
android.disallowKotlinSourceSets=false

# Android
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.enableResourceOptimizations=false

kotlin.code.style=official
googleServices.missing.passthrough=true